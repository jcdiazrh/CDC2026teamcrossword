# Builds the web app in /codebase/website/mixed-feelings_cd/web and publishes it to GitHub Pages on every push to main.
# One-time setup: Settings -> Pages -> Source: "GitHub Actions"
#                 Settings -> Secrets and variables -> Actions -> Variables -> SPOTIFY_CLIENT_ID and LASTFM_API_KEY
name: Deploy web app

on:
  push:
    branches: [main]
    paths: ['codebase/website/mixed-feelings_cd/web/**', 'r_coefficients.csv', '.github/workflows/deploy-web.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codebase/website/mixed-feelings_cd/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: codebase/website/mixed-feelings_cd/web/package-lock.json
      - run: npm ci
      # If the team uploaded R coefficients (r_coefficients.csv at the repo root), rebuild the model from them
      - name: Use R coefficients if present
        run: |
          if [ -f "$GITHUB_WORKSPACE/r_coefficients.csv" ]; then
            pip install pandas numpy
            python3 scripts/build_r_model.py
          fi
      - run: node scripts/check.mjs
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_SPOTIFY_CLIENT_ID: ${{ vars.SPOTIFY_CLIENT_ID }}
          VITE_LASTFM_API_KEY: ${{ vars.LASTFM_API_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: codebase/website/mixed-feelings_cd/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
